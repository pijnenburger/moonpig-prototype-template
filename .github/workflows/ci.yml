name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@moonpig"

      - name: Install dependencies
        run: npm ci
        env:
          MNPG_NPM_REGISTRY_API_KEY: ${{ secrets.MNPG_NPM_REGISTRY_API_KEY }}

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
